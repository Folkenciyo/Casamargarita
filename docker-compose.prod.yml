# Producción — este es el fichero que consume Dokploy.
# El dominio y el certificado TLS se configuran desde la UI de Dokploy:
# NO añadir labels de Traefik a mano.
services:
  migrator:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://art:${POSTGRES_PASSWORD}@postgres:5432/casamargarita?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    # SESSION_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD_HASH y PUBLIC_URL.
    # format: raw es imprescindible: sin él Compose interpola los `$` del hash
    # argon2 y el login deja de funcionar. `.env` cubre el caso de Dokploy,
    # que vuelca ahí las variables definidas en su UI.
    env_file:
      - path: .env
        format: raw
        required: false
      - path: .env.app
        format: raw
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://art:${POSTGRES_PASSWORD}@postgres:5432/casamargarita?schema=public
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  # Vacía la papelera una vez al día. Usa la imagen de la app porque necesita
  # Prisma y el pipeline de imágenes para borrar también las fotos del disco.
  purge:
    build:
      context: .
      target: dev
    command: >
      sh -c "while true; do pnpm purge-trash || true; sleep 86400; done"
    env_file:
      - path: .env
        format: raw
        required: false
      - path: .env.app
        format: raw
        required: false
    environment:
      DATABASE_URL: postgresql://art:${POSTGRES_PASSWORD}@postgres:5432/casamargarita?schema=public
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  # Copia diaria y, una vez por semana, restauración de prueba. Usa la imagen
  # de Postgres porque solo necesita pg_dump, psql y tar: nada de Node.
  backup:
    image: postgres:16-alpine
    command: /app/scripts/backup-cron.sh
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: art
      POSTGRES_DB: casamargarita
      UPLOADS_DIR: /uploads
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./scripts:/app/scripts:ro
      - uploads:/uploads:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: art
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: casamargarita
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U art -d casamargarita"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  # Declararlo persistente en Dokploy, igual que uploads: es el único sitio
  # donde vive lo que salvaría un desastre.
  backups:
